# DGX Spark variant — fewer GPUs, identical code path. Override nproc-per-node
# at launch (we don't hardcode it because the GB10 SKU varies).
run_id: ""
seed: 42
output_dir: runs
nproc_per_node: 4         # adjust at launch via Hydra override
dp_shard_size: -1
dp_replicate_size: 1
parallel: fsdp          # "fsdp" | "ddp" — override at CLI for DDP runs
mixed_precision: true
activation_checkpoint: true
ac_every_other_block: false

# Topology-invariant gradient reduction (auditable). "nccl" opts out for throughput.
reduction_mode: deterministic_allgather
